# dsh-decision — decision layer as a profile patch over dsh-base.
# Machine Decision in shadow: Jev evaluates in the background while native
# DSH behavior stays authoritative. Review evidence before enforcing.
- insert:
    # Core: neutral judgments, deterministic policy and DSH seams.
    - id: decision
      name: "@techs/dsh-decision"
      config:
        provider: jev
        permission: machine
        enforcement: shadow
        machine:
          uncertain: human
        guardrail:
          enabled: true
          # tools: [bash, run_command]          # empty screens every tool (0.5–1.5s per call)
          # risks:
          #   secretExposure: { reviewAt: 0.15, denyAt: 0.70 } # experimental
          #   destructive: { reviewAt: 0.35, denyAt: 0.85 }    # experimental
          # onFailure: allow                    # adapter failure stance: allow | ask | deny
        # routing:
        #   enabled: true
        #   confidenceFloor: 0.6
        #   routes:                             # provider/model come from your deployment; never built in
        #     - { key: cheap,    provider: your-provider, model: your-small-model }
        #     - { key: flagship, provider: your-provider, model: your-big-model,  description: hard multi-file reasoning }
        # judge:
        #   enabled: true
        #   blockAt: 0.75
        # approval:                            # enabled automatically in machine mode
        #   allowAt: 0.85
        #   rejectBelow: 0.5
    # Jev adapter: registers on ctx.decision once the core service exists.
    - id: decision-jev
      name: "@techs/dsh-decision-jev"
      config:
        # API key from the environment; never commit keys.
        apiKeyEnv: JEV_API_KEY
        # baseUrl: https://jev-ai.pro/api   # default; use https://api.typesafe.ai for TypeSafe native
        # model: jev-latest                 # default
