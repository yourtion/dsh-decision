# dsh-decision — decision layer as a profile patch over dsh-base.
# Machine Decision in shadow: Jev evaluates in the background while native
# DSH behavior stays authoritative. Review evidence before enforcing.
- insert:
    # Core: neutral judgments, deterministic policy and DSH seams.
    - id: decision
      name: "@techs/dsh-decision"
      config:
        provider: jev
        permission: machine
        enforcement: shadow
        machine:
          uncertain: human
        privacy:
          outbound: redact # redact masks credential-shaped content before Jev; raw sends as-is
        audit:
          enabled: true # sanitized verdict audit; defaults to ~/.local/state/dsh-decision/dsh-audit.jsonl
        guardrail:
          enabled: true
          # tools: [bash, run_command]          # empty screens every tool (0.5–1.5s per call)
          # risks:                              # omitted → recalibrated built-ins (2026-09-26 eval)
          #   secretExposure: { reviewAt: 0.55, denyAt: 0.85 }
          #   destructive: { reviewAt: 0.45, denyAt: 0.55 }
          #   scopeViolation: { enabled: false } # first-class disable: not asked, not judged
          # customRisks:                        # user-defined dimensions, same aggregation rights
          #   financialExposure:
          #     instructions: "Could this tool call move money?"
          #     reviewAt: 0.3
          #     denyAt: 0.7                      # custom dimensions require explicit calibration
          # onFailure: allow                    # adapter failure stance: allow | ask | deny
        # routing:
        #   enabled: true
        #   confidenceFloor: 0.6
        #   routes:                             # provider/model come from your deployment; never built in
        #     - { key: cheap,    provider: your-provider, model: your-small-model }
        #     - { key: flagship, provider: your-provider, model: your-big-model,  description: hard multi-file reasoning }
        # judge:
        #   enabled: true
        #   blockAt: 0.75
        # approval:                            # enabled automatically in machine mode
        #   allowAt: 0.85
        #   rejectBelow: 0.5
    # Jev adapter: registers on ctx.decision once the core service exists.
    - id: decision-jev
      name: "@techs/dsh-decision-jev"
      config:
        # Vercel AI Gateway key from the environment; never commit keys.
        apiKeyEnv: AI_GATEWAY_API_KEY
        baseUrl: https://ai-gateway.vercel.sh/typesafe
        model: typesafe-ai/jev
        # For a direct Jev key instead, use baseUrl: https://jev-ai.pro/api and model: jev-latest.
